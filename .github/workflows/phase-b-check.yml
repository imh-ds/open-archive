name: Phase B local detector check
# Fixture-only pre-freeze checks for examples/phase_b_local_detector.py (no study data).
# Timeouts are 3x the estimated duration of each part (owner rule).
'on':
  workflow_dispatch: {}
  push:
    branches: [codex/multiengine-preflight]
    paths: [.github/workflows/phase-b-check.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: phase-b-check
  cancel-in-progress: false
defaults:
  run:
    shell: pwsh
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  register:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo 'Registration only; no computation.'
  part:
    if: github.event_name == 'workflow_dispatch'
    name: check (${{ matrix.part }})
    runs-on: windows-2022
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {part: core, timeout: 45}
          - {part: loops_ols, timeout: 30}
          - {part: loops_F1, timeout: 90}
          - {part: loops_F2, timeout: 60}
          - {part: loops_F3, timeout: 60}
          - {part: loops_F4, timeout: 60}
          - {part: determinism, timeout: 30}
          - {part: smoke, timeout: 150}
          - {part: runtime, timeout: 90}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            examples/
            .github/workflows/phase-b-check.yml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.9
      - name: Install pinned runtime
        timeout-minutes: 10
        run: |
          python -m pip install numpy==1.26.4 scipy==1.11.2 pandas==2.2.3 patsy==1.0.1 packaging==23.2 statsmodels==0.14.4 scikit-learn==1.3.0 lightgbm==4.6.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run check part
        env:
          PART: ${{ matrix.part }}
        run: |
          $workers = [Environment]::ProcessorCount
          "cpu count: $workers"
          New-Item -ItemType Directory -Force .phase-b-check | Out-Null
          python -I examples/phase_b_local_detector.py --check --part $env:PART --out .phase-b-check --workers $workers
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phase-b-check-part-${{ matrix.part }}
          path: .phase-b-check/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
  combine:
    needs: part
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            examples/
            .github/workflows/phase-b-check.yml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.9
      - name: Install pinned runtime
        timeout-minutes: 10
        run: |
          python -m pip install numpy==1.26.4 scipy==1.11.2 pandas==2.2.3 patsy==1.0.1 packaging==23.2 statsmodels==0.14.4 scikit-learn==1.3.0 lightgbm==4.6.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          pattern: phase-b-check-part-*
          path: .phase-b-check/parts
      - name: Combine parts into check.json
        run: |
          python -I examples/phase_b_local_detector.py --combine-check .phase-b-check/parts --out .phase-b-check/combined
          $code = $LASTEXITCODE
          if (Test-Path .phase-b-check/combined/check.json) { "``````json" >> $env:GITHUB_STEP_SUMMARY; Get-Content .phase-b-check/combined/check.json -TotalCount 400 >> $env:GITHUB_STEP_SUMMARY; "``````" >> $env:GITHUB_STEP_SUMMARY }
          exit $code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phase-b-check
          path: .phase-b-check/combined/
          if-no-files-found: error
          retention-days: 30
