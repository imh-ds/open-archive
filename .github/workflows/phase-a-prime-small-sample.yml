name: Phase A' small-sample variance estimators
'on':
  workflow_dispatch: {}
  push:
    branches: [codex/multiengine-preflight]
    paths: [.github/workflows/phase-a-prime-small-sample.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: phase-a-prime-small-sample
  cancel-in-progress: false
defaults:
  run:
    shell: pwsh
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  GH_TOKEN: ${{ github.token }}
  MANIFEST: examples/study_manifests/phase-a-prime-small-sample.json
  RESULTS: examples/results/2026-10-17-phase-a-prime-small-sample
jobs:
  register:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo 'Registration only; no scientific computation.'
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            examples/phase_a_linear_reference.py
            examples/phase_a_prime_small_sample.py
            examples/phase_a_prime_actions.py
            examples/study_manifests/phase-a-prime-small-sample.json
            examples/results/2026-10-17-phase-a-prime-small-sample/review.py
            .github/workflows/phase-a-prime-small-sample.yml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.9
      - name: Install pinned runtime
        timeout-minutes: 5
        run: |
          python -m pip install numpy==1.26.4 scipy==1.11.2 pandas==2.2.3 patsy==1.0.1 packaging==23.2 statsmodels==0.14.4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - id: plan
        name: Verify frozen manifest, run cross-platform checks, freeze chunk plan
        run: |
          $matrix = python -I examples/phase_a_prime_actions.py prepare --manifest $env:MANIFEST --out .phase-a-prime/prepare --shards 20
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "matrix=$matrix" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phase-a-prime-prepare
          path: .phase-a-prime/prepare/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  shard:
    name: shard (${{ matrix.shard }})
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            examples/phase_a_linear_reference.py
            examples/phase_a_prime_small_sample.py
            examples/phase_a_prime_actions.py
            examples/study_manifests/phase-a-prime-small-sample.json
            .github/workflows/phase-a-prime-small-sample.yml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.9
      - name: Install pinned runtime
        timeout-minutes: 5
        run: |
          python -m pip install numpy==1.26.4 scipy==1.11.2 pandas==2.2.3 patsy==1.0.1 packaging==23.2 statsmodels==0.14.4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phase-a-prime-prepare
          path: .phase-a-prime/prepare
      - name: Compute assigned chunks (stops starting new chunks after 45 minutes)
        timeout-minutes: 50
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python -I examples/phase_a_prime_actions.py shard --manifest $env:MANIFEST --plan .phase-a-prime/prepare/plan.json --shard $env:SHARD --out .phase-a-prime/shard --deadline-seconds 2700
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        timeout-minutes: 5
        with:
          name: phase-a-prime-shard-${{ matrix.shard }}
          path: .phase-a-prime/shard/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
  aggregate:
    needs: [prepare, shard]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            examples/phase_a_linear_reference.py
            examples/phase_a_prime_small_sample.py
            examples/phase_a_prime_actions.py
            examples/study_manifests/phase-a-prime-small-sample.json
            examples/results/2026-10-17-phase-a-prime-small-sample/review.py
            .github/workflows/phase-a-prime-small-sample.yml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.9
      - name: Install pinned runtime
        timeout-minutes: 5
        run: |
          python -m pip install numpy==1.26.4 scipy==1.11.2 pandas==2.2.3 patsy==1.0.1 packaging==23.2 statsmodels==0.14.4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phase-a-prime-prepare
          path: .phase-a-prime/prepare
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          pattern: phase-a-prime-shard-*
          path: .phase-a-prime/downloaded
      - name: Reassemble cells, summarize, and apply frozen criteria
        run: |
          python -I examples/phase_a_prime_actions.py aggregate --manifest $env:MANIFEST --plan .phase-a-prime/prepare/plan.json --download .phase-a-prime/downloaded --results $env:RESULTS
          $code = $LASTEXITCODE
          Copy-Item .phase-a-prime/prepare/plan.json, .phase-a-prime/prepare/prepare.json, .phase-a-prime/prepare/manifest.json $env:RESULTS
          if ($code -ne 0) { exit $code }
      - name: Independent review (recomputation and 2% regeneration)
        run: |
          python -I "$env:RESULTS/review.py" --workers 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Step summary
        if: always()
        run: |
          if (Test-Path "$env:RESULTS/aggregate.json") { "``````json" >> $env:GITHUB_STEP_SUMMARY; Get-Content "$env:RESULTS/aggregate.json" -TotalCount 60 >> $env:GITHUB_STEP_SUMMARY; "``````" >> $env:GITHUB_STEP_SUMMARY }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phase-a-prime-results
          path: ${{ env.RESULTS }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: aggregate
    if: ${{ always() && needs.aggregate.result == 'success' }}
    permissions:
      contents: write
      actions: read
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            examples/phase_a_linear_reference.py
            examples/phase_a_prime_small_sample.py
            examples/phase_a_prime_actions.py
            .github/workflows/phase-a-prime-small-sample.yml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.9
      - name: Install pinned runtime
        timeout-minutes: 5
        run: |
          python -m pip install numpy==1.26.4 scipy==1.11.2 pandas==2.2.3 patsy==1.0.1 packaging==23.2 statsmodels==0.14.4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phase-a-prime-results
          path: .phase-a-prime/results
      - name: Publish durable prerelease and verify by download
        run: |
          python -I examples/phase_a_prime_actions.py publish --results .phase-a-prime/results --tag "phase-a-prime-small-sample-2026-10-17-${{ github.run_id }}" --target "${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phase-a-prime-publication-verification
          path: .phase-a-prime/results/publication-verification.json
          if-no-files-found: error
          retention-days: 30
