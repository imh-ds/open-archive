name: Exploratory validation timing probe
# Times one dataset per engine x N x {linear, U-shape} on the study runner,
# to size the validation study. Timeouts are 3x the estimate (owner rule).
'on':
  workflow_dispatch: {}
  push:
    branches: [codex/exploratory-mode]
    paths: [.github/workflows/exploratory-validation-probe.yml]
permissions:
  contents: read
concurrency:
  group: exploratory-validation-probe
  cancel-in-progress: false
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  register:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo 'Registration only; no computation.'
  probe:
    if: github.event_name == 'workflow_dispatch'
    name: probe (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {engine: ols, timeout: 30}
          - {engine: elastic_net, timeout: 60}
          - {engine: lightgbm, timeout: 90}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/
            examples/exploratory_validation.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.9
      - name: Install pinned runtime
        timeout-minutes: 10
        run: |
          python -m pip install numpy==1.26.4 scipy==1.11.2 pandas==2.2.3 scikit-learn==1.3.0 lightgbm==4.6.0 PyYAML==6.0.2
          python -m pip check
      - name: Probe
        run: |
          workers=$(nproc)
          echo "cpu count: $workers"
          python -I examples/exploratory_validation.py probe --out .probe --workers "$workers" --engines ${{ matrix.engine }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: exploratory-probe-${{ matrix.engine }}
          path: .probe/
          include-hidden-files: true
          if-no-files-found: warn
