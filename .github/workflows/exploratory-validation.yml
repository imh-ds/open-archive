name: Exploratory validation study
# Revision plan §5/§8: 3 engines x N (300, 500, 1000) x 4 shapes, 200 datasets per cell.
# Budget from probe run 39182459285 (single-thread seconds per dataset, 4 workers per job):
# about 1,650 runner-minutes measured; each cell's timeout is 3x its estimate (owner rule),
# so the hard ceiling is about 4,970 runner-minutes.
'on':
  workflow_dispatch: {}
  push:
    branches: [codex/exploratory-mode]
    paths: [.github/workflows/exploratory-validation.yml]
permissions:
  contents: read
concurrency:
  group: exploratory-validation
  cancel-in-progress: false
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  register:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo 'Registration only; no computation.'
  cell:
    if: github.event_name == 'workflow_dispatch'
    name: cell (${{ matrix.engine }}, ${{ matrix.n }}, ${{ matrix.shape }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {engine: ols, n: 300, shape: linear, timeout: 60}
          - {engine: ols, n: 300, shape: u_shape, timeout: 30}
          - {engine: ols, n: 300, shape: threshold, timeout: 60}
          - {engine: ols, n: 300, shape: saturating, timeout: 60}
          - {engine: ols, n: 500, shape: linear, timeout: 135}
          - {engine: ols, n: 500, shape: u_shape, timeout: 65}
          - {engine: ols, n: 500, shape: threshold, timeout: 135}
          - {engine: ols, n: 500, shape: saturating, timeout: 135}
          - {engine: ols, n: 1000, shape: linear, timeout: 175}
          - {engine: ols, n: 1000, shape: u_shape, timeout: 30}
          - {engine: ols, n: 1000, shape: threshold, timeout: 175}
          - {engine: ols, n: 1000, shape: saturating, timeout: 175}
          - {engine: elastic_net, n: 300, shape: linear, timeout: 70}
          - {engine: elastic_net, n: 300, shape: u_shape, timeout: 30}
          - {engine: elastic_net, n: 300, shape: threshold, timeout: 70}
          - {engine: elastic_net, n: 300, shape: saturating, timeout: 70}
          - {engine: elastic_net, n: 500, shape: linear, timeout: 190}
          - {engine: elastic_net, n: 500, shape: u_shape, timeout: 30}
          - {engine: elastic_net, n: 500, shape: threshold, timeout: 190}
          - {engine: elastic_net, n: 500, shape: saturating, timeout: 190}
          - {engine: elastic_net, n: 1000, shape: linear, timeout: 205}
          - {engine: elastic_net, n: 1000, shape: u_shape, timeout: 30}
          - {engine: elastic_net, n: 1000, shape: threshold, timeout: 205}
          - {engine: elastic_net, n: 1000, shape: saturating, timeout: 205}
          - {engine: lightgbm, n: 300, shape: linear, timeout: 95}
          - {engine: lightgbm, n: 300, shape: u_shape, timeout: 95}
          - {engine: lightgbm, n: 300, shape: threshold, timeout: 95}
          - {engine: lightgbm, n: 300, shape: saturating, timeout: 95}
          - {engine: lightgbm, n: 500, shape: linear, timeout: 235}
          - {engine: lightgbm, n: 500, shape: u_shape, timeout: 95}
          - {engine: lightgbm, n: 500, shape: threshold, timeout: 235}
          - {engine: lightgbm, n: 500, shape: saturating, timeout: 235}
          - {engine: lightgbm, n: 1000, shape: linear, timeout: 305}
          - {engine: lightgbm, n: 1000, shape: u_shape, timeout: 265}
          - {engine: lightgbm, n: 1000, shape: threshold, timeout: 305}
          - {engine: lightgbm, n: 1000, shape: saturating, timeout: 305}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/
            examples/exploratory_validation.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.9
      - name: Install pinned runtime
        timeout-minutes: 10
        run: |
          python -m pip install numpy==1.26.4 scipy==1.11.2 pandas==2.2.3 scikit-learn==1.3.0 lightgbm==4.6.0 PyYAML==6.0.2
          python -m pip check
      - name: Run cell
        run: |
          # nproc honours OMP_NUM_THREADS=1, so ask Python for the CPU count.
          workers=$(python -c 'import os; print(os.cpu_count())')
          echo "cpu count: $workers"
          python -I examples/exploratory_validation.py run --engine ${{ matrix.engine }} --n ${{ matrix.n }}             --shape ${{ matrix.shape }} --reps 0:200 --out .cell --workers "$workers"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exploratory-cell-${{ matrix.engine }}-${{ matrix.n }}-${{ matrix.shape }}
          path: .cell/
          include-hidden-files: true
          if-no-files-found: error
  aggregate:
    if: github.event_name == 'workflow_dispatch' && !cancelled()
    needs: cell
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/
            examples/exploratory_validation.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.9
      - name: Install pinned runtime
        timeout-minutes: 10
        run: |
          python -m pip install numpy==1.26.4 scipy==1.11.2 pandas==2.2.3 scikit-learn==1.3.0 lightgbm==4.6.0 PyYAML==6.0.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: exploratory-cell-*
          path: cells
      - name: Aggregate
        run: |
          found=$(ls cells | wc -l)
          echo "cell artifacts: $found of 36"
          python -I examples/exploratory_validation.py aggregate --inputs cells --out results
          cp -r cells results/cells
          echo "$found" > results/cell-count.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exploratory-validation-results
          path: results/
          if-no-files-found: error
